<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Arts Plastiques — explorer l'art et comprendre l'IA, de façon interactive." />
  <meta name="theme-color" content="#0b0d1a" />
  <title>Arts Plastiques</title>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- Fond ambiant animé (halos colorés flottants) -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient__blob ambient__blob--1"></div>
    <div class="ambient__blob ambient__blob--2"></div>
    <div class="ambient__blob ambient__blob--3"></div>
  </div>

  <div class="shell">
    <header class="shell__header">
      <a class="shell__brand" href="#" aria-label="Arts Plastiques, accueil">
        <span class="shell__brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.6 0-.5-.2-.8-.5-1.1-.3-.3-.5-.7-.5-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.4-4-7.9-9-7.9z"/>
            <circle cx="7.5" cy="10.5" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16.5" cy="10.5" r="1"/>
          </svg>
        </span>
        <span>Arts Plastiques</span>
      </a>

      <!-- La navigation des modules est injectée ici par le shell -->
      <div id="nav-slot"></div>

      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Changer de thème"></button>
    </header>

    <main class="shell__main">
      <!-- Les modules se montent ici -->
      <div id="module-root"></div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
